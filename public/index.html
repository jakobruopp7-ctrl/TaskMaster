<!DOCTYPE html>
<!--
  index.html — TaskMaster Frontend-Struktur
  ------------------------------------------
  Diese Datei definiert die sichtbare Struktur der gesamten App.
  Sie ist das Skelett: jedes Panel, Formular, jede Schaltfläche
  und Liste auf dem Bildschirm ist hier deklariert.

  style.css  steuert das AUSSEHEN.
  app.js     steuert das VERHALTEN.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Sorgt dafür, dass das Layout auf Mobilgeräten korrekt skaliert -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskMaster</title>

  <!-- Verknüpfung mit dem Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===================== HEADER ===================== -->
  <!-- Obere Leiste: App-Name links, "+ Task hinzufügen"-Button rechts.
       Die Button-ID wird von app.js verwendet, um einen Klick-Event
       zu registrieren. -->
  <header class="app-header">
    <h1 class="app-title">TaskMaster</h1>
    <button id="openModalBtn" class="btn btn-primary">+ Add Task</button>
  </header>


  <!-- ===================== HAUPTLAYOUT ===================== -->
  <!-- Zweispaltiges Layout: Sidebar links, Task-Cards rechts.
       Flexbox in style.css übernimmt die Nebeneinanderpositionierung. -->
  <main class="app-layout">

    <!-- --- SIDEBAR: Kategorie-Filter --- -->
    <!-- Beim Klicken auf ein Kategorie-Element wird ein Filter in app.js
         ausgelöst. Das data-category-Attribut teilt dem Skript mit,
         welche Kategorie ausgewählt wurde. -->
    <aside class="sidebar">
      <h2 class="sidebar-title">Categories</h2>
      <ul id="categoryList" class="category-list">
        <li class="category-item active" data-category="All">All Tasks</li>
        <li class="category-item" data-category="Work">Work</li>
        <li class="category-item" data-category="Personal">Personal</li>
        <li class="category-item" data-category="School">School</li>
        <li class="category-item" data-category="General">General</li>
      </ul>
    </aside>

    <!-- --- TASK-LISTENBEREICH --- -->
    <!-- Die h2-Überschrift aktualisiert sich bei Kategorienwechsel.
         Das div#taskList ist der Container, in den app.js Task-Cards einfügt. -->
    <section class="task-section">
      <h2 id="sectionTitle" class="section-title">All Tasks</h2>

      <div id="taskList" class="task-list">
        <!-- Task-Cards werden hier dynamisch von app.js eingefügt -->
      </div>
    </section>

  </main>


  <!-- ===================== MODAL (POP-UP-FORMULAR) ===================== -->
  <!-- Standardmäßig ausgeblendet — app.js entfernt die "hidden"-Klasse,
       um es anzuzeigen. Das Klicken auf den dunklen Hintergrund
       schließt es ebenfalls. -->
  <div id="taskModal" class="modal hidden">
    <div class="modal-content">

      <!-- Titel wechselt zwischen "Neuen Task hinzufügen" und "Task bearbeiten" -->
      <h2 id="modalTitle">Add New Task</h2>

      <form id="taskForm">

        <!-- Verstecktes Feld: speichert die ID des bearbeiteten Tasks.
             Leer beim Erstellen eines neuen Tasks. -->
        <input type="hidden" id="taskId">

        <!-- Titel ist das einzige Pflichtfeld -->
        <div class="form-group">
          <label for="taskTitle">Title *</label>
          <input type="text" id="taskTitle" placeholder="Enter task title" required>
        </div>

        <!-- Beschreibung ist optional -->
        <div class="form-group">
          <label for="taskDescription">Description</label>
          <textarea id="taskDescription" rows="3" placeholder="Optional description..."></textarea>
        </div>

        <!-- Kategorie-Dropdown — Optionen entsprechen dem Sidebar-Filter -->
        <div class="form-group">
          <label for="taskCategory">Category</label>
          <select id="taskCategory">
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="School">School</option>
          </select>
        </div>

        <!-- Datum-Eingabe — Browser zeigt einen nativen Datepicker -->
        <div class="form-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate">
        </div>

        <!-- Formular-Buttons: Speichern sendet ab, Abbrechen schließt das Modal -->
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
        </div>

      </form>
    </div>
  </div>


  <!-- app.js wird zuletzt geladen, damit alle HTML-Elemente
       oben bereits geladen sind, wenn das Skript sie sucht. -->
  <script src="app.js"></script>

</body>
</html>
